<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ベンチャービジネス論 期末対策 模擬問題集</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1>ベンチャービジネス論<span> 期末対策</span></h1>
    <span class="badge">全14回・引用付き解説</span>
  </header>

  <!-- SELECT SCREEN -->
  <section id="screen-select" class="screen active">
    <p class="intro">対策したい回を選んでください（複数選択可）。選んだ回の中からランダムに問題が出題されます。数字の暗記問題は出さず、実際の確認テストの傾向に合わせてシナリオ応用・真偽問題を中心に出題します。回答すると正解・不正解にかかわらず、該当資料からの引用付き解説が表示されます。</p>
    <div id="lectureGrid" class="lecture-grid"></div>
    <div class="controls-row">
      <button class="btn-ghost btn-small" id="btnSelectAll">全て選択</button>
      <button class="btn-ghost btn-small" id="btnSelectNone">選択解除</button>
      <div class="spacer"></div>
      <label style="font-size:.85rem;color:var(--sub);">出題数</label>
      <select id="countSelect" class="count-select"></select>
    </div>
    <button class="btn-primary" id="btnStart" disabled>この内容で開始する</button>
  </section>

  <!-- QUIZ SCREEN -->
  <section id="screen-quiz" class="screen">
    <div class="quiz-topbar">
      <span id="quizProgressText">問題 1 / 20</span>
      <span id="quizScoreText">正解 0</span>
    </div>
    <div class="progressbar"><div class="fill" id="progressFill" style="width:0%"></div></div>
    <div class="q-lecture-tag" id="qLectureTag">第1回</div>
    <p class="q-text" id="qText"></p>
    <div class="choices" id="choicesBox"></div>

    <div class="explain-box" id="explainBox">
      <div class="verdict" id="verdictText"></div>
      <div class="quote" id="quoteText"></div>
    </div>

    <div class="nav-row">
      <button class="btn-primary" id="btnNext" style="display:none;">次の問題へ</button>
    </div>
  </section>

  <!-- RESULT SCREEN -->
  <section id="screen-result" class="screen">
    <div class="result-hero">
      <div class="score" id="finalScore">0 / 0</div>
      <div class="sub">正答率 <span id="finalPct">0%</span></div>
    </div>
    <div class="result-list" id="resultList"></div>
    <div class="result-actions">
      <button class="btn-ghost" id="btnBackToSelect">回を選び直す</button>
      <button class="btn-primary" id="btnRetrySame">同じ範囲でもう一度</button>
    </div>
  </section>

  <footer class="foot">澤野弘明「ベンチャービジネス論」講義資料より作成した自習用の模擬問題集です。</footer>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
